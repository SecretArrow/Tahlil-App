# Project-wide Gradle settings.
# IMPORTANT: This file should *NOT* be checked into Version Control Systems,
# as it contains information specific to your local configuration.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Disable build features
android.defaults.buildfeatures.buildconfig=true

# Enable Gradle Build Cache
org.gradle.caching=true

# Parallel builds
org.gradle.parallel=true

# Configuration on demand
org.gradle.configureondemand=false

# R8 full mode ON — matches Tahlil-Singkat exactly.
# Previously set to false as a workaround for the ModifierLocalProvider ICE.
# That did NOT help (crash persisted in CI run 42022378566). Singkat runs
# with the default (true) and works fine, so we match Singkat here.
