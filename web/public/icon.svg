<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: deep emerald → teal, diagonal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset="0.5" stop-color="#065F46"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <!-- Soft radial glow centered on the motif -->
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold stroke gradient for the 8-point star outline -->
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <!-- Solid gold for the inner 5-point star -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background fills the full square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- 8-pointed Islamic star (Rub el Hizb) — gold outline
       Two overlapping squares centered at (256, 232), side = 192.
       Axis-aligned: x in [160,352], y in [136,328]
       Rotated 45°: diamond vertices at (256,100)/(384,232)/(256,364)/(128,232) -->
  <g transform="translate(256,232)">
    <path d="M-96,-96 L96,-96 L96,96 L-96,96 Z"
          fill="none"
          stroke="url(#goldStroke)"
          stroke-width="11"
          stroke-linejoin="round"/>
    <path d="M0,-132 L132,0 L0,132 L-132,0 Z"
          fill="none"
          stroke="url(#goldStroke)"
          stroke-width="11"
          stroke-linejoin="round"/>
    <!-- Inner darker gold stroke for depth -->
    <path d="M-87,-87 L87,-87 L87,87 L-87,87 Z"
          fill="none"
          stroke="#B45309"
          stroke-width="3.5"
          stroke-linejoin="round"
          opacity="0.65"/>
    <path d="M0,-120 L120,0 L0,120 L-120,0 Z"
          fill="none"
          stroke="#B45309"
          stroke-width="3.5"
          stroke-linejoin="round"
          opacity="0.65"/>

    <!-- Crescent moon (cream), opens upward
         Outer circle c=(0,-2) r=52; cut circle c=(0,-16) r=45. -->
    <path d="M0,-54
             A 52 52 0 1 0 0 50
             A 52 52 0 1 0 0,-54 Z
             M0,-61
             A 45 45 0 1 0 0 29
             A 45 45 0 1 0 0,-61 Z"
          fill="#FEF3C7"
          fill-rule="evenodd"/>

    <!-- Gold 5-point star cradled inside the crescent
         Center (0,-12), outer R=17, inner r=7. -->
    <path d="M0,-29 L4,-15 L20,-14 L7,-4 L11,11 L0,2 L-11,11 L-7,-4 L-20,-14 L-4,-15 Z"
          fill="url(#gold)"/>
  </g>
</svg>
