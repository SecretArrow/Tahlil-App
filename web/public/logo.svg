<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset="0.45" stop-color="#047857"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EFEA"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>

  <!-- Background: deep emerald -> teal diagonal gradient + soft glow -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- Night-sky sparkles -->
  <circle cx="150" cy="118" r="5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="372" cy="92" r="4" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="390" cy="196" r="4" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="128" cy="212" r="3.5" fill="#FFFFFF" opacity="0.35"/>

  <!-- Crescent (cream), opens upward -->
  <path fill="#FEF3C7" fill-rule="evenodd"
        d="M256,102 a32,32 0 1,0 0,64 a32,32 0 1,0 0,-64 Z
           M256,86 a28,28 0 1,0 0,56 a28,28 0 1,0 0,-56 Z"/>

  <!-- Gold star cradled in the crescent -->
  <path fill="#F59E0B"
        d="M256,111 L258.23,119.55 L268.36,119.98 L261.23,125.70 L263.64,134.52
           L256,129.5 L248.36,134.52 L250.77,125.70 L243.64,119.98 L253.77,119.55 Z"/>

  <!-- Mosque dome (white), rises behind the book -->
  <path fill="url(#dome)"
        d="M192,318 C192,268 206,246 222,224 C236,205 248,192 256,188
           C264,192 276,205 290,224 C306,246 320,268 320,318 Z"/>

  <!-- Dome door (arched, deep emerald) -->
  <path fill="#065F46"
        d="M236,318 L236,284 C236,270 245,262 256,262 C267,262 276,270 276,284 L276,318 Z"/>

  <!-- Open book: gold cover -->
  <path fill="#F59E0B"
        d="M256,318 C219,295 176,291 136,299 L136,404 C176,396 219,400 256,422
           C293,400 336,396 376,404 L376,299 C336,291 293,295 256,318 Z"/>

  <!-- Open book: cream pages -->
  <path fill="url(#page)"
        d="M256,324 C222,303 184,299 146,306 L146,394 C184,388 222,392 256,412 Z"/>
  <path fill="url(#page)"
        d="M256,324 C290,303 328,299 366,306 L366,394 C328,388 290,392 256,412 Z"/>

  <!-- Spine -->
  <path d="M256,326 L256,410" stroke="#D97706" stroke-width="4" opacity="0.6" stroke-linecap="round" fill="none"/>

  <!-- Page lines -->
  <path d="M164,322 C192,317 218,321 240,331" stroke="#D97706" stroke-width="5" opacity="0.45" stroke-linecap="round" fill="none"/>
  <path d="M164,346 C192,341 218,345 240,355" stroke="#D97706" stroke-width="5" opacity="0.45" stroke-linecap="round" fill="none"/>
  <path d="M348,322 C320,317 294,321 272,331" stroke="#D97706" stroke-width="5" opacity="0.45" stroke-linecap="round" fill="none"/>
  <path d="M348,346 C320,341 294,345 272,355" stroke="#D97706" stroke-width="5" opacity="0.45" stroke-linecap="round" fill="none"/>
</svg>
