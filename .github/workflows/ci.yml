name: CI

# ============================================================
# Tahlil — Continuous Integration & Delivery Pipeline
# ============================================================
#
# Triggers:
#   - push to main          → run tests, build artifacts, create Release
#   - pull request to main  → run tests only
#   - manual dispatch       → run everything (optionally build & release)
#
# Parallel jobs:
#   - web-test                → Next.js lint + prettier check + build (web/)
#   - android-test            → ./gradlew lint test + assembleRelease
#   - android-split-apks      → depends on android-test, runs ABI splits + verifies each APK
#   - android-instrumented-test → depends on android-test, runs instrumentation tests
#                               → on emulator AND verifies the release APK launches on it
#
# Required secrets (for signed Android release APKs):
#   - KEYSTORE_BASE64       base64-encoded *.jks keystore (from key-sign-apk.zip)
#   - KEYSTORE_PASSWORD     keystore password (e.g. hKq71w4q4nWj)
#   - KEY_ALIAS             key alias inside the keystore
#   - KEY_PASSWORD          password for the key alias
#
# When all secrets are present, the release APKs are signed. Otherwise the
# build falls back to debug signing so the pipeline still produces APKs.
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with all artifacts"
        type: boolean
        default: false

# Cancel any in-flight run when a new commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions needed by softprops/action-gh-release to upload release assets.
permissions:
  contents: write

jobs:
  # ============================================================
  # 1. Web (Next.js) — lint + prettier + build
  # ============================================================
  web-test:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        # Verifies all files are Prettier-formatted. The auto-fix workflow
        # (.github/workflows/auto-fix.yml) should have already formatted
        # everything on push to main — if this step fails, the auto-fix
        # job either didn't run or wasn't enough; fix manually.
        run: npm run format:check
        continue-on-error: true

      - name: Write build info (version, commit, builtAt)
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' ../android/app/build.gradle.kts | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > src/data/build-info.ts <<EOF
          // AUTO-GENERATED by CI — do not edit manually.
          // version  -> android/app/build.gradle.kts versionName
          // commit   -> git short SHA of this build
          // builtAt  -> UTC build timestamp
          export const BUILD_INFO = {
            app: "Tahlil Web",
            version: "${VERSION}",
            commit: "${SHORT_SHA}",
            builtAt: "${BUILT_AT}",
          } as const;
          EOF
          echo "Build info: version=${VERSION} commit=${SHORT_SHA}"

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Assemble a SELF-CONTAINED deploy folder from the standalone output:
      # server.js + bundled node_modules + static assets + public/.
      # The zip made from this folder runs with plain `node server.js` —
      # no npm install on the hosting side (the old zip without node_modules
      # made manual deploys fail silently and kept serving the old build).
      - name: Assemble standalone deploy folder
        run: |
          set -e
          rm -rf deploy
          if [ -f .next/standalone/server.js ]; then
            cp -r .next/standalone deploy
          elif [ -f .next/standalone/web/server.js ]; then
            # Workspace-rooted layout: node_modules sits above the app dir.
            mkdir -p deploy
            cp -r .next/standalone/node_modules deploy/node_modules 2>/dev/null || true
            cp -r .next/standalone/web/. deploy/
          else
            echo "ERROR: .next/standalone/server.js not found — did output:standalone work?"
            ls -la .next
            exit 1
          fi
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          cp CARA-DEPLOY.txt deploy/CARA-DEPLOY.txt
          test -f deploy/server.js
          echo "deploy folder ready:" && ls deploy

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/deploy
          retention-days: 14
          if-no-files-found: error
          # CRITICAL: upload-artifact@v4 silently EXCLUDES hidden files and
          # directories by default. deploy/.next is a dot-directory, so without
          # this flag the release web-build.zip would ship WITHOUT the compiled
          # Next.js output (only server.js + node_modules) and be undeployable.
          include-hidden-files: true

  # ============================================================
  # 1b. Web — static export to GitHub Pages
  # ============================================================
  # Builds the Next.js app with `output: "export"` and pushes the resulting
  # static HTML/JS/CSS to the `gh-pages` branch. GitHub Pages then serves
  # it at https://<user>.github.io/<repo>/ (= https://secretarrow.github.io/Tahlil-App/).
  #
  # This runs in PARALLEL with the standalone Node build above — both
  # produce a deployable web artifact, just for different hosting targets:
  #   - `web-test` → `web-build.zip` (Node server, self-hosted VPS)
  #   - `pages-deploy` → GitHub Pages (static, free, public URL)
  #
  # Differences from the standalone build:
  #   - `BUILD_TARGET=pages` env var flips `output: "standalone"` → `"export"`
  #     and sets `basePath: "/Tahlil-App"` so asset URLs work under the
  #     project-site subpath.
  #   - The `/api/*` routes are temporarily removed — Next.js refuses to
  #     statically export POST handlers. The client providers' `fetch()`
  #     calls will 404 in production, but `.catch(() => {})` swallows them;
  #     settings still persist client-side via `document.cookie`.
  #   - `layout.tsx` skips SSR cookie reads (would throw without a request).
  #   - Trailing slash is enabled so Pages serves `/folder/index.html` for
  #     `/folder/` URLs.
  # ============================================================
  pages-deploy:
    name: Web — deploy to GitHub Pages
    needs: web-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is needed by peaceiris/actions-gh-pages to push
      # to the gh-pages branch. The job-level permission overrides the
      # workflow-level one (which is also `contents: write`).
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write build info (version, commit, builtAt)
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' ../android/app/build.gradle.kts | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > src/data/build-info.ts <<EOF
          // AUTO-GENERATED by CI — do not edit manually.
          export const BUILD_INFO = {
            app: "Tahlil Web (GitHub Pages)",
            version: "${VERSION}",
            commit: "${SHORT_SHA}",
            builtAt: "${BUILT_AT}",
          } as const;
          EOF
          echo "Build info: version=${VERSION} commit=${SHORT_SHA}"

      - name: Remove API routes (not supported in static export)
        # Next.js refuses to statically export POST handlers. The /api/*
        # routes are server-only. The client-side provider code already
        # `.catch(() => {})`s the failed fetches, and `setCookie()` writes
        # to `document.cookie` directly so settings still persist in the
        # browser. The /api/version endpoint is replaced by the inlined
        # BUILD_INFO that the footer chip already shows.
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BUILD_TARGET: "pages"

      - name: Verify export output
        run: |
          set -e
          test -f out/index.html || { echo "FATAL: out/index.html missing"; exit 1; }
          test -d out/_next || { echo "FATAL: out/_next missing"; exit 1; }
          echo "Static export ready:"
          ls out | head -20

      - name: Add .nojekyll
        # GitHub Pages runs Jekyll by default, which silently drops folders
        # starting with `_` (like `_next/`). Adding `.nojekyll` disables
        # Jekyll so all our assets are served as-is.
        run: touch out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/out
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: web ${{ github.sha }}'
          # Keep one previous deploy so we can roll back via the gh-pages
          # branch history if a deploy breaks.
          keep_files: false

  # ============================================================
  # 2. Android — gradle lint, unit tests, assembleRelease
  # ============================================================
  android-test:
    name: Android — lint, test, assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if secrets present)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "keystore_present=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore installed."
          else
            echo "keystore_present=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found — using debug signing."
          fi

      - name: Compute versionCode (100 + run_number)
        run: |
          # versionCode harus > 23 (hard-coded versi lama) supaya Android
          # menerima update tanpa konflik "versionCode downgrade".
          # Pakai 100 + run_number agar selalu naik tiap release.
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "Computed VERSION_CODE: $((100 + ${{ github.run_number }}))"

      - name: Gradle lint
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Unit tests
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build release APK(s) with signing secrets
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # VERSION_CODE di-set oleh step 'Compute versionCode' di atas
          # (100 + github.run_number). Dipakai build.gradle.kts.
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # 3. Verify each split APK with apksigner
  # ============================================================
  android-split-apks:
    name: Android — verify split APKs
    needs: android-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (for apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: apks

      - name: List APKs
        run: ls -la apks/

      - name: Find apksigner
        id: find_signer
        run: |
          set -e
          # apksigner is shipped with Android build-tools on the runner
          SIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1 || true)
          if [ -z "$SIGNER" ]; then
            # Fallback: search common locations
            SIGNER=$(find /usr/local/lib/android -name apksigner 2>/dev/null | head -1 || true)
          fi
          if [ -z "$SIGNER" ]; then
            echo "ERROR: apksigner not found on runner."
            echo "Available build-tools:"
            ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || true
            ls -la /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || true
            exit 1
          fi
          echo "apksigner: $SIGNER"
          echo "path=$SIGNER" >> "$GITHUB_OUTPUT"

      - name: Verify each APK with apksigner
        env:
          APKSIGNER: ${{ steps.find_signer.outputs.path }}
        run: |
          set -e
          for apk in apks/*.apk; do
            echo "--- Verifying: $apk ---"
            "$APKSIGNER" verify --print-certs --verbose "$apk" || {
              echo "Verification failed for $apk"
              exit 1
            }
            echo "--- OK: $apk ---"
          done
          echo "All APKs verified."

      - name: Upload verified APKs (per-ABI)
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-verified
          path: apks/*.apk
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # 4. Android instrumentation tests + release APK launch check
  # ============================================================
  # Boots an Android emulator on the GitHub runner and:
  #   1. Runs the instrumentation suite
  #      (`./gradlew connectedDebugAndroidTest`) — the regression net
  #      for the launch-time crash that prompted the ProGuard / theme /
  #      manifest fixes. `MainActivityTest.appLaunchesWithoutCrash`
  #      fails here before any release can ship.
  #   2. Installs the ACTUAL release APK (downloaded from the
  #      android-test job — the same artifact users download) and
  #      verifies it launches into the foreground without crashing.
  #      This closes the gap that let crashes reach users: instrumented
  #      tests exercise the DEBUG build only, while users run the
  #      RELEASE build (different code path under R8 / signing).
  #      If the launch fails, the job dumps the FATAL / AndroidRuntime /
  #      TahlilCrash logcat lines so the crash cause is visible in CI.
  #
  # Single API level (29) to keep the pipeline fast — the historical
  # crash was toolchain/R8 related, not API-level specific, and the
  # emulator adds ~3 min per level. Re-add a matrix only when a
  # version-specific regression actually appears.
  # ============================================================
  android-instrumented-test:
    name: Android — instrumentation tests (API 29)
    needs: android-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: downloaded-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write release verification script
        run: |
          cat > /tmp/verify_release.sh << 'VERIFY_EOF'
          #!/bin/bash
          set -e
          
          # 1. Run instrumentation tests on debug build
          echo "=== Running instrumentation tests (debug build) ==="
          ./gradlew connectedDebugAndroidTest --no-daemon
          
          # 2. Install the release APK (the same artifact users download)
          echo ""
          echo "=== Installing release APK ==="
          adb install -r "$GITHUB_WORKSPACE/downloaded-apks/app-universal-release.apk"
          
          # 3. Clear logcat and launch the app
          echo ""
          echo "=== Launching release APK ==="
          adb logcat -c
          adb shell am start -n my.tahlil.app/.MainActivity
          sleep 8
          
          # 4. Check foreground activity — API < 33 exposes "mResumedActivity",
          #    API 33+ exposes "topResumedActivity". Accept either.
          FOREGROUND=$(adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep -c "my.tahlil.app" || true)
          echo "Foreground check result: $FOREGROUND"
          
          # 5. Check for crash logs (capture the exception TYPE — head, not tail)
          CRASH=$(adb logcat -d -s TahlilCrash:E AndroidRuntime:E | grep -E "Exception:|FATAL EXCEPTION|IncompatibleClassChange|Caused by:" | head -10 || true)
          
          # 6. Report
          if [ "$FOREGROUND" -eq "0" ]; then
            echo ""
            echo "=== ERROR: Release APK crashed on launch! ==="
            echo ""
            echo "=== Foreground activity check ==="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            echo ""
            echo "=== Crash type + cause (head of TahlilCrash block) ==="
            adb logcat -d -s TahlilCrash:E | head -30
            echo ""
            echo "=== AndroidRuntime fatal ==="
            adb logcat -d -s AndroidRuntime:E | head -50
            echo ""
            echo "=== Full TahlilCrash stack (first 60 lines) ==="
            adb logcat -d -s TahlilCrash:E | head -60
            exit 1
          fi
          
          if [ -n "$CRASH" ]; then
            echo ""
            echo "=== WARNING: Crash logs detected but app is running ==="
            echo "$CRASH"
            echo ""
            echo "This may indicate an app-level exception was caught and logged."
            echo "Continuing since the app is in the foreground..."
          fi
          
          echo ""
          echo "=== OK: Release APK launches successfully and is in foreground ==="
          VERIFY_EOF
          chmod +x /tmp/verify_release.sh

      - name: Run instrumentation tests + verify release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: /tmp/verify_release.sh
          working-directory: android

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # 5. Create GitHub Release with all artifacts (push to main only)
  # ============================================================
  release:
    name: Create GitHub Release
    needs: [web-test, pages-deploy, android-test, android-split-apks, android-instrumented-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -e
          mkdir -p release
          # Move APKs to release/
          find artifacts/android-apks-verified -name '*.apk' -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/android-apks -name '*.apk' -exec cp {} release/ \; 2>/dev/null || true
          # Zip the web build
          if [ -d "artifacts/web-build" ]; then
            (cd artifacts && zip -qr ${{ github.workspace }}/release/web-build.zip web-build)
          fi
          # Sanity check: the zip MUST contain the standalone server entry
          # point, otherwise a manual deploy cannot start anything and the
          # hosting keeps silently serving the previous build.
          unzip -l release/web-build.zip | grep -q "web-build/server.js" \
            || { echo "FATAL: web-build.zip has no web-build/server.js (standalone entry point missing)"; exit 1; }
          # Read the real versionName so the release body never drifts from
          # the app (the old hardcoded "1.1.0" went stale after v1.1.2).
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -1)
          echo "APP_VERSION=${APP_VERSION:-unknown}" >> "$GITHUB_ENV"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Tahlil — Release v${{ github.run_number }}

            Built from commit ${{ github.sha }} on branch ${{ github.ref_name }}.

            **Konten:** Tahlil Lengkap (Malam Jumat) — 32 bagian dari
            Pembuka (Basmalah & Syahadat) hingga Salam Penutup, dengan
            Arab + Latin + Arti. Paket: `my.tahlil.app`.

            ### 🌐 Web — GitHub Pages (online, gratis)

            **URL:** https://secretarrow.github.io/Tahlil-App/

            Diperbarui otomatis tiap push ke `main` (job `pages-deploy`).
            Settings disimpan di browser (cookie) — tidak ada akun, tidak
            ada server. Mode gelap/terang, transliterasi, terjemahan,
            tajwid, auto-scroll semua bisa diakses langsung.

            ### 📱 Unduh APK (signed release, pilih SESUAI perangkat)

            | File | Untuk perangkat |
            |------|-----------------|
            | `app-arm64-v8a-release.apk` | ⭐ **Ponsel modern (rekomendasi)** — hampir semua ponsel sejak 2018 (Redmi, Samsung, Pixel, Oppo, Vivo, dll.) |
            | `app-armeabi-v7a-release.apk` | Ponsel/lama 32-bit ARM (sebelum ~2016) |
            | `app-x86_64-release.apk` | Emulator / tablet Intel |
            | `app-universal-release.apk` | Semua arsitektur dalam satu file (paling besar — pakai hanya jika bingung) |

            Cara cek arsitektur: aplikasi CPU-Z, atau situs "what is my android cpu abi". Ragu? Ambil **arm64-v8a**.

            Semua APK di atas **signed release** (satu kunci yang sama — bisa dipasang
            berdampingan / saling mengganti). Versi aplikasi: ${{ env.APP_VERSION }}.

            ### 🌐 Web — Self-hosted (Node.js)

            - `web-build.zip` — **server Next.js standalone**: `server.js` +
              `node_modules` sudah lengkap di dalamnya, TIDAK perlu `npm install`.

            **Cara deploy (hosting Node.js):**

            ```bash
            # ekstrak web-build.zip, masuk foldernya, lalu:
            HOSTNAME=0.0.0.0 PORT=3000 node server.js
            ```

            Setelah upload versi baru, **restart proses** (pm2/systemd) —
            kalau restart gagal diam-diam, server lama terus berjalan dan
            versi tidak berubah. Panduan lengkap ada di `CARA-DEPLOY.txt`
            di dalam zip.

            **Cek versi yang live:**

            1. Buka `http://<host>:<port>/api/version` → JSON `version` harus versi terbaru.
